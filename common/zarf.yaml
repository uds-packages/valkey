kind: ZarfPackageConfig
metadata:
  name: uds-valkey-common
  description: "UDS Valkey Common"
  url: https://github.com/valkey-io/valkey

components:
  - name: valkey-redis-uri-output
    description: "Reads the Valkey password secret and sets REDIS_URI as a Zarf variable"
    required: false
    actions:
      onDeploy:
        after:
          - cmd: |
              svc=$(./zarf tools kubectl get svc valkey-primary -n valkey --ignore-not-found 2>/dev/null | grep -q . && echo valkey-primary || echo valkey)
              password=$(./zarf tools kubectl get secret valkey-password -n valkey -o go-template='{{index .data "valkey-password" | base64decode}}')
              printf 'redis://:%s@%s.valkey.svc.cluster.local:6379' "$password" "$svc"
            description: "Read Valkey password and set REDIS_URI"
            mute: true
            setVariables:
              - name: REDIS_URI
                sensitive: true

  - name: valkey
    required: true
    charts:
      - name: uds-valkey-config
        namespace: valkey
        version: 0.1.0
        localPath: ../chart
        values:
          - sourcePath: .uds-valkey-config
            targetPath: .
      - name: valkey
        version: 4.0.2
        namespace: valkey
        url: oci://ghcr.io/defenseunicorns/bitferno/valkey
        valuesFiles:
          - ../values/values.yaml
        values:
          - sourcePath: .valkey
            targetPath: .
            excludePaths:
              - .valkey.auth
              - .valkey.global.imageRegistry
              - .valkey.global.imagePullSecrets
              - .valkey.global.security
              - .valkey.global.valkey.password
              - .valkey.global.compatibility.openshift.adaptSecurityContext
              - .valkey.diagnosticMode
              - .valkey.extraDeploy
              - .valkey.image
              - .valkey.networkPolicy
              - .valkey.podSecurityPolicy
              - .valkey.rbac
              - .valkey.serviceAccount
              - .valkey.serviceBindings
              - .valkey.primary.args
              - .valkey.primary.automountServiceAccountToken
              - .valkey.primary.command
              - .valkey.primary.containerPorts
              - .valkey.primary.podSecurityContext
              - .valkey.primary.containerSecurityContext
              - .valkey.primary.extraEnvVars
              - .valkey.primary.extraEnvVarsCM
              - .valkey.primary.extraEnvVarsSecret
              - .valkey.primary.extraVolumeMounts
              - .valkey.primary.extraVolumes
              - .valkey.primary.sidecars
              - .valkey.primary.initContainers
              - .valkey.primary.service
              - .valkey.replica.args
              - .valkey.replica.automountServiceAccountToken
              - .valkey.replica.command
              - .valkey.replica.containerPorts
              - .valkey.replica.podSecurityContext
              - .valkey.replica.containerSecurityContext
              - .valkey.replica.extraEnvVars
              - .valkey.replica.extraEnvVarsCM
              - .valkey.replica.extraEnvVarsSecret
              - .valkey.replica.extraVolumeMounts
              - .valkey.replica.extraVolumes
              - .valkey.replica.sidecars
              - .valkey.replica.initContainers
              - .valkey.replica.service
              - .valkey.sentinel.args
              - .valkey.sentinel.automountServiceAccountToken
              - .valkey.sentinel.command
              - .valkey.sentinel.containerPorts
              - .valkey.sentinel.image
              - .valkey.sentinel.podSecurityContext
              - .valkey.sentinel.containerSecurityContext
              - .valkey.sentinel.extraEnvVars
              - .valkey.sentinel.extraEnvVarsCM
              - .valkey.sentinel.extraEnvVarsSecret
              - .valkey.sentinel.extraVolumeMounts
              - .valkey.sentinel.extraVolumes
              - .valkey.sentinel.sidecars
              - .valkey.sentinel.initContainers
              - .valkey.sentinel.service
              - .valkey.metrics.args
              - .valkey.metrics.automountServiceAccountToken
              - .valkey.metrics.command
              - .valkey.metrics.containerPorts
              - .valkey.metrics.image
              - .valkey.metrics.containerSecurityContext
              - .valkey.metrics.extraEnvVars
              - .valkey.metrics.extraEnvVarsCM
              - .valkey.metrics.extraEnvVarsSecret
              - .valkey.metrics.extraVolumeMounts
              - .valkey.metrics.extraVolumes
              - .valkey.metrics.service
              - .valkey.volumePermissions
              - .valkey.kubectl
